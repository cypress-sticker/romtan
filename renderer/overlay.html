<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }

  :root {
    --accent: #a78bfa;
    --accent2: #34d399;
    --border-g: rgba(167, 139, 250, 0.25);
    --text: #f0eaff;
    --text-muted: rgba(220, 210, 255, 0.55);
    --popup-bg: rgba(20, 12, 45, 0.92);
  }
  body.light-mode {
    --accent: #7c3aed;
    --accent2: #059669;
    --border-g: rgba(124, 58, 237, 0.22);
    --text: #1e1033;
    --text-muted: rgba(60, 40, 120, 0.55);
    --popup-bg: rgba(240, 235, 255, 0.96);
  }

  .popup-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .popup {
    position: absolute;
    pointer-events: none;
    animation: popup-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup.removing {
    animation: popup-out 0.3s ease forwards;
  }
  @keyframes popup-in {
    from { opacity: 0; transform: scale(0.75) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes popup-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.8); }
  }

  .popup-card {
    background: var(--popup-bg);
    border: 1px solid var(--border-g);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 220px;
    max-width: 300px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .popup-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .popup-label {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'Syne Mono', 'Courier New', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .popup-name {
    font-family: 'Syne Mono', 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
    word-break: break-all;
  }
  .popup-name span { color: var(--accent); }

  .popup[data-pos="top-left"]     { top: 20px; left: 20px; }
  .popup[data-pos="top-right"]    { top: 20px; right: 20px; }
  .popup[data-pos="bottom-left"]  { bottom: 20px; left: 20px; }
  .popup[data-pos="bottom-right"] { bottom: 20px; right: 20px; }

  /* 上中央・下中央（translateX補正） */
  .popup[data-pos="top-center"] {
    top: 20px; left: 50%;
    animation: popup-in-xcenter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup[data-pos="bottom-center"] {
    bottom: 20px; left: 50%;
    animation: popup-in-xcenter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup[data-pos="top-center"].removing,
  .popup[data-pos="bottom-center"].removing {
    animation: popup-out-xcenter 0.3s ease forwards;
  }
  @keyframes popup-in-xcenter {
    from { opacity: 0; transform: translateX(-50%) scale(0.75); }
    to   { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes popup-out-xcenter {
    from { opacity: 1; transform: translateX(-50%) scale(1); }
    to   { opacity: 0; transform: translateX(-50%) scale(0.8); }
  }

  /* 左中央・右中央（translateY補正） */
  .popup[data-pos="middle-left"] {
    top: 50%; left: 20px;
    animation: popup-in-ycenter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup[data-pos="middle-right"] {
    top: 50%; right: 20px;
    animation: popup-in-ycenter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup[data-pos="middle-left"].removing,
  .popup[data-pos="middle-right"].removing {
    animation: popup-out-ycenter 0.3s ease forwards;
  }
  @keyframes popup-in-ycenter {
    from { opacity: 0; transform: translateY(-50%) scale(0.75); }
    to   { opacity: 1; transform: translateY(-50%) scale(1); }
  }
  @keyframes popup-out-ycenter {
    from { opacity: 1; transform: translateY(-50%) scale(1); }
    to   { opacity: 0; transform: translateY(-50%) scale(0.8); }
  }

  /* 中央（translate両方補正） */
  .popup[data-pos="center"] {
    top: 50%; left: 50%;
    animation: popup-in-center 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .popup[data-pos="center"].removing {
    animation: popup-out-center 0.3s ease forwards;
  }
  @keyframes popup-in-center {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes popup-out-center {
    from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    to   { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  }
</style>
</head>
<body>
<div class="popup-container" id="popupContainer"></div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playSound(type) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  switch(type) {
    case 'pop': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(440, now + 0.12);
      g.gain.setValueAtTime(0.35, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      o.start(now); o.stop(now + 0.2);
      break;
    }
    case 'chime': {
      [523, 659, 784].forEach((freq, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.value = freq;
        const t0 = now + i * 0.12;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.28, t0 + 0.04);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
        o.start(t0); o.stop(t0 + 0.55);
      });
      break;
    }
    case 'game': {
      [330, 440, 550, 660].forEach((freq, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.connect(g); g.connect(ctx.destination);
        o.frequency.value = freq;
        const t0 = now + i * 0.07;
        g.gain.setValueAtTime(0.2, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
        o.start(t0); o.stop(t0 + 0.1);
      });
      break;
    }
    case 'wa': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(392, now);
      o.frequency.setValueAtTime(523, now + 0.15);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.22, now + 0.05);
      g.gain.setValueAtTime(0.22, now + 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      o.start(now); o.stop(now + 0.85);
      break;
    }
    case 'subtle': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 1200;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.06, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      o.start(now); o.stop(now + 0.15);
      break;
    }
  }
}

function showPopup(data) {
  const { username, sound, duration, position } = data;

  if (sound !== 'none') playSound(sound);

  const container = document.getElementById('popupContainer');
  const popup = document.createElement('div');
  popup.className = 'popup';
  popup.setAttribute('data-pos', position);
  popup.innerHTML = `
    <div class="popup-card">
      <div class="popup-icon">👋</div>
      <div class="popup-text">
        <div class="popup-label">入室しました</div>
        <div class="popup-name"><span>@</span>${username}</div>
      </div>
    </div>
  `;
  container.appendChild(popup);

  setTimeout(() => {
    popup.classList.add('removing');
    setTimeout(() => popup.remove(), 350);
  }, duration);
}

window.electronAPI.onShowPopup((data) => {
  showPopup(data);
});

window.electronAPI.onThemeSync((isDark) => {
  document.body.classList.toggle('light-mode', !isDark);
});
</script>
</body>
</html>
